services:
  health-monitor:
    build: .
    image: hythzx/health-monitor:latest
    container_name: health-monitor
    ports:
      - "8080:8080"
    volumes:
      - ./config:/app/config:ro
      - ./logs:/app/logs
      - ./data:/app/data
    environment:
      TZ: Asia/Shanghai
      HEALTH_MONITOR_WEB_TOKEN: ${HEALTH_MONITOR_WEB_TOKEN:?请在.env中设置至少16位管理令牌}
    restart: unless-stopped
    command: ["python", "main.py", "config/config.yaml", "--web", "--web-host", "0.0.0.0"]
